<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="SmartPack Dashboard – Monitor your SmartPack, track schoolbag load and posture, view insights, and stay informed with real-time alerts."
    />

    <meta name="author" content="Trevor Gituru" />

    <!-- Open Graph -->
    <meta property="og:title" content="SmartPack Dashboard" />
    <meta
      property="og:description"
      content="Monitor your SmartPack, track schoolbag load and posture, view insights, and stay informed with real-time alerts."
    />
    <meta property="og:url" content="https://smartpack.razaoul.co.ke/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/smartpack-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartPack Dashboard" />
    <meta
      name="twitter:description"
      content="Monitor your SmartPack, track schoolbag load and posture, view insights, and stay informed with real-time alerts."
    />
    <meta name="twitter:image" content="/smartpack-og.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://smartpack.razaoul.co.ke/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SmartPack Dashboard",
        "url": "https://smartpack.razaoul.co.ke/",
        "description": "SmartPack Dashboard for monitoring schoolbag load, posture, device status, insights, and alerts.",
        "contributor": [
          {
            "@type": "Person",
            "name": "Trevor Gituru",
            "jobTitle": "Full Stack Developer",
            "description": "Contributed to the development and build process of the SmartPack Dashboard.",
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "Jomo Kenyatta University of Agriculture and Technology (JKUAT)"
            },
            "sameAs": ["https://github.com/trevor-gituru", "https://trevor-gituru.vercel.app"]
          }
        ]
      }
    </script>

    <title>SmartPack Dashboard</title>
  </head>

  <body>
    <noscript>
      <strong>
        We're sorry, but SmartPack Dashboard requires JavaScript to work properly. Please enable
        JavaScript to continue.
      </strong>
    </noscript>

    <div id="app">
      <div class="app-loading">
        <div class="app-loading__spinner">
          <img src="/favicon.svg" alt="SmartPack" class="app-loading__logo" />
        </div>
      </div>
    </div>
    <style>
      .app-loading {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f9fafb;
        font-family: system-ui, sans-serif;
      }

      .app-loading__spinner {
        display: flex;
        width: 76px;
        height: 76px;
        align-items: center;
        justify-content: center;
        border: 4px solid #e9d5ff;
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }

      .app-loading__logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        animation: app-loading-counter-spin 0.8s linear infinite;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-loading-counter-spin {
        to {
          transform: rotate(-360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        .app-loading {
          background: #111827;
        }

        .app-loading__spinner {
          border-color: #581c87;
          border-top-color: #c084fc;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__spinner,
        .app-loading__logo {
          animation: none;
        }
      }
    </style>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
